# Include inside nginx's http context.
# Container deployment: the application service must resolve as demo:8080.
# Transparent source binding requires OS capabilities and return-path routing;
# see README.md. Do not silently remove proxy_bind.

limit_conn_zone $binary_remote_addr zone=per_client:1m;
limit_conn_zone $server_name zone=all_clients:1m;

upstream application {
    server demo:8080;
}

server {
    listen 443 ssl;
    server_name app-agentlatch.manykiln.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # Workspace credentials occur in request paths, including failed requests.
    access_log off;
    error_log /dev/null;

    # The application accepts catalogue uploads up to 1 MiB. Nginx must not
    # impose the obsolete 64 KiB limit used by the original demo.
    client_max_body_size 1m;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 5s;
    reset_timedout_connection on;

    # Keep proxy admission below the application's 16-worker ceiling while
    # also preventing one source from occupying the entire allowance.
    limit_conn per_client 4;
    limit_conn all_clients 12;
    limit_conn_status 429;
    limit_req_status 429;

    location / {
        proxy_pass http://application;
        proxy_http_version 1.0;
        proxy_set_header Connection close;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;

        proxy_set_header Host app-agentlatch.manykiln.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_bind $remote_addr transparent;
    }
}
